<!doctype html>
<html lang="te"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>రశీదు Receipt Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Telugu',system-ui,sans-serif;background:#f3f4f6;color:#111}
.app{display:flex;min-height:100vh}.side{width:210px;background:#1e293b;padding:16px;flex-shrink:0}
.side h3{color:#fff;margin:0 0 16px;font-size:16px}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#cbd5e1;padding:10px;border-radius:6px;cursor:pointer;font:inherit}
.side button.on,.side button:hover{background:#334155;color:#fff}
main{flex:1;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0002}
label{display:block;font-size:13px;color:#475569;margin:10px 0 3px}input,select,textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
.btn{padding:9px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font:inherit;margin:10px 6px 0 0}.btn.g{background:#64748b}.btn.r{background:#dc2626}.btn.ok{background:#16a34a}
.template-layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:20px;align-items:start}
.template-editor{max-width:760px}.template-editor h2{margin:0 0 6px;font-size:22px}.template-editor .intro{color:#475569;margin:0 0 18px;font-size:14px}
.text-block{border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin:12px 0;background:#fff}
.text-block strong{display:block;color:#334155;font-size:14px;margin-bottom:6px}
.text-block textarea{min-height:64px;resize:vertical;line-height:1.6}
.field-chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.field-chips button{border:1px solid #94a3b8;background:#f8fafc;color:#1e293b;border-radius:16px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.field-chips button:hover{background:#e2e8f0}
.template-actions{position:sticky;bottom:0;background:#fff;padding:12px 0;border-top:1px solid #e2e8f0;margin-top:16px}
.template-actions input{max-width:360px}.advanced-template{margin-top:14px;border-top:1px solid #e2e8f0;padding-top:12px}
.advanced-template summary{cursor:pointer;color:#334155;font-weight:700}
.advanced-row{display:flex;gap:8px;margin:8px 0;align-items:center}.advanced-row input{min-width:0}
.template-preview{position:sticky;top:20px}
.paper{background:#fff;border:1px solid #888;padding:40px 36px;max-width:640px;margin:auto;font-size:15px;line-height:2;min-height:700px}
.paper p{margin:0;min-height:1em;white-space:pre-wrap}.paper .title{text-align:center;font-size:30px;font-weight:700;text-decoration:underline}
.paper .justify{text-align:justify}.paper .sig,.paper .label{font-weight:700}
.toast{position:fixed;top:14px;right:14px;padding:10px 16px;border-radius:8px;color:#fff;z-index:9}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}.row{display:flex;gap:6px;margin-bottom:6px}
@media(max-width:800px){.app{flex-direction:column}.side{width:100%;display:flex;gap:6px;flex-wrap:wrap}.side h3{width:100%;margin:0}.side button{width:auto}.grid,.template-layout{grid-template-columns:1fr}.paper{padding:20px}.template-preview{position:static}.template-actions{position:static}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const FIELDS=[["date","తేదీ / Date"],["mandal","మండలం blank (after మండలం)"],["name","Name of the VAA/VHA/MPEO/AEO/BTM"],["account","BANK A/C No"],["ifsc","IFSC code"],["bank","Bank Name & Branch"]];
const FIELD_HINTS=[["date","Date"],["mandal","Mandal"],["name","Officer name"],["account","Account number"],["ifsc","IFSC code"],["bank","Bank name & branch"]];
const BLANK={date:"_".repeat(16),mandal:"_".repeat(26)};
const fill=(t,d)=>FIELDS.reduce((s,[k])=>s.split(`{{${k}}}`).join((d[k]||"").trim()||BLANK[k]||""),t);
const EMPTY=Object.fromEntries(FIELDS.map(([k])=>[k,""]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});
 if(!r.ok){let m="Request failed";try{const j=await r.json();m=typeof j.detail==="string"?j.detail:"Invalid input"}catch{}throw new Error(m)}return r}
const Preview=({tpl,data})=><div className="paper">{tpl.map((l,i)=><p key={i} className={l.s}>{fill(l.t,data)}</p>)}</div>;

function App(){
 const [view,setView]=useState("create"),[tpl,setTpl]=useState([]),[data,setData]=useState(EMPTY),[editId,setEditId]=useState(null),[toast,setToast]=useState(null);
 const note=(m,bad)=>{setToast({m,bad});setTimeout(()=>setToast(null),3000)};
 const run=async f=>{try{await f()}catch(e){note(e.message,true)}};
 const loadTpl=()=>run(async()=>setTpl(await (await api("/api/template")).json()));
 useEffect(()=>{loadTpl()},[]);
 const download=fmt=>run(async(d=data)=>{const r=await api("/api/export/"+fmt,{method:"POST",body:JSON.stringify(d)});
  const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="receipt."+fmt;a.click();note("Downloaded "+fmt.toUpperCase())});
 const save=()=>run(async()=>{await api(editId?"/api/receipts/"+editId:"/api/receipts",{method:editId?"PUT":"POST",body:JSON.stringify(data)});note("Receipt saved");setEditId(null);setData(EMPTY)});
 const nav=[["create","Create Receipt"],["saved","Saved Receipts"],["template","Edit Default Template"]];
 return <div className="app"><nav className="side"><h3>రశీదు Manager</h3>
  {nav.map(([k,l])=><button key={k} className={view===k?"on":""} onClick={()=>setView(k)}>{l}</button>)}</nav>
  <main>{toast&&<div className="toast" style={{background:toast.bad?"#dc2626":"#16a34a"}}>{toast.m}</div>}
  {view==="create"&&<div className="grid"><div className="card"><b>{editId?"Editing receipt #"+editId:"New receipt"}</b>
   {FIELDS.map(([k,l])=><div key={k}><label>{l}</label><input value={data[k]} onChange={e=>setData({...data,[k]:e.target.value})}/></div>)}
   <button className="btn ok" onClick={save}>Save</button><button className="btn" onClick={()=>download("docx")}>Word</button>
   <button className="btn" onClick={()=>download("pdf")}>PDF</button><button className="btn g" onClick={()=>{setData(EMPTY);setEditId(null)}}>Clear</button></div>
   <Preview tpl={tpl} data={data}/></div>}
  {view==="saved"&&<Saved setView={setView} setData={setData} setEditId={setEditId} run={run} note={note} dl={async d=>{setData(d);}}/>}
  {view==="template"&&<TemplateEditor tpl={tpl} reload={loadTpl} run={run} note={note}/>}
  </main></div>}

function Saved({setView,setData,setEditId,run,note}){
 const [q,setQ]=useState(""),[rows,setRows]=useState([]);
 const load=()=>run(async()=>setRows(await (await api("/api/receipts?q="+encodeURIComponent(q))).json()));
 useEffect(()=>{load()},[q]);
 const dl=(r,fmt)=>run(async()=>{const rs=await api("/api/export/"+fmt,{method:"POST",body:JSON.stringify(r)});
  const a=document.createElement("a");a.href=URL.createObjectURL(await rs.blob());a.download=`receipt-${r.id}.${fmt}`;a.click()});
 return <div className="card"><b>Saved receipts ({rows.length})</b><input placeholder="Search name, date, mandal, bank…" value={q} onChange={e=>setQ(e.target.value)} style={{margin:"10px 0"}}/>
  <div style={{overflowX:"auto"}}><table><thead><tr><th>#</th><th>Date</th><th>Mandal</th><th>Name</th><th></th></tr></thead><tbody>
  {rows.map(r=><tr key={r.id}><td>{r.id}</td><td>{r.date}</td><td>{r.mandal}</td><td>{r.name}</td><td style={{whiteSpace:"nowrap"}}>
   <button className="btn g" onClick={()=>{setData(r);setEditId(r.id);setView("create")}}>Edit</button>
   <button className="btn" onClick={()=>dl(r,"docx")}>Word</button><button className="btn" onClick={()=>dl(r,"pdf")}>PDF</button>
   <button className="btn r" onClick={()=>confirm("Delete this receipt?")&&run(async()=>{await api("/api/receipts/"+r.id,{method:"DELETE"});note("Deleted");load()})}>Delete</button></td></tr>)}
  </tbody></table></div></div>}

function TemplateEditor({tpl,reload,run,note}){
 const [d,setD]=useState(tpl),[activeLine,setActiveLine]=useState(null);
 const textareas=useRef({});
 useEffect(()=>setD(tpl),[tpl]);
 const set=(i,k,v)=>setD(d.map((l,j)=>j===i?{...l,[k]:v}:l));
 const insert=(token)=>{const i=activeLine??d.findIndex(l=>l.s!=="space");if(i<0)return;
  const el=textareas.current[i],value=d[i].t||"",start=el?.selectionStart??value.length,end=el?.selectionEnd??value.length;
  const next=value.slice(0,start)+`{{${token}}}`+value.slice(end);set(i,"t",next);setActiveLine(i);
  requestAnimationFrame(()=>{el?.focus();el?.setSelectionRange(start+token.length+4,start+token.length+4)})};
 const labelFor=(l)=>l.s==="title"?"Receipt heading":l.s==="sig"?"Signature text":l.s==="justify"?"Main receipt message":l.t.includes("{{date}}")||l.t.trim().startsWith("తేదీ")||l.t.trim().toLowerCase().startsWith("date")?"Date line":l.s==="label"?"Bank or officer detail":l.s==="space"?"Blank space":"Other receipt text";
 const save=()=>run(async()=>{await api("/api/template",{method:"PUT",body:JSON.stringify(d)});await reload();note("Template updated")});
 const content=d.map((l,i)=>({l,i})).filter(({l})=>l.s!=="space");
 return <div className="template-layout"><section className="card template-editor">
  <h2>Edit receipt text</h2><p className="intro">Click a text box and change the wording. The preview updates as you type. Saved receipts are not changed.</p>
  {content.map(({l,i})=><div className="text-block" key={i}>
   <strong>{labelFor(l)}</strong>
   <textarea aria-label={labelFor(l)} ref={el=>textareas.current[i]=el} value={l.t} onFocus={()=>setActiveLine(i)} onChange={e=>set(i,"t",e.target.value)}/>
   <details><summary>Text style</summary><select aria-label={`Style for ${labelFor(l)}`} value={l.s} onChange={e=>set(i,"s",e.target.value)}>
    {["title","body","justify","sig","label"].map(s=><option key={s} value={s}>{s==="title"?"Large centered heading":s==="body"?"Normal text":s==="justify"?"Wide paragraph":s==="sig"?"Signature":"Bold detail"}</option>)}
   </select><button className="btn r" onClick={()=>setD(d.filter((_,j)=>j!==i))}>Remove this text</button></details>
  </div>)}
  <div className="text-block"><strong>Insert a field that fills in for each receipt</strong>
   <p style={{fontSize:13,color:"#475569",margin:"0 0 8px"}}>Choose a text box above, then click a field to insert it where your cursor is.</p>
   <div className="field-chips">{FIELD_HINTS.map(([key,label])=><button type="button" key={key} onMouseDown={e=>e.preventDefault()} onClick={()=>insert(key)}>{label}</button>)}</div>
  </div>
  <details className="advanced-template"><summary>Advanced layout and spacing</summary>
   <p style={{fontSize:13,color:"#475569"}}>Use this only if you want to change the order, formatting, or blank spacing of receipt lines.</p>
   {d.map((l,i)=><div className="advanced-row" key={i}>
    <select aria-label={`Line ${i+1} style`} value={l.s} onChange={e=>set(i,"s",e.target.value)}>{["title","body","justify","sig","label","space"].map(s=><option key={s} value={s}>{s==="space"?"Blank space":s}</option>)}</select>
    <input aria-label={`Line ${i+1} text`} value={l.t} onChange={e=>set(i,"t",e.target.value)}/>
    <button className="btn r" style={{margin:0}} aria-label={`Remove line ${i+1}`} onClick={()=>setD(d.filter((_,j)=>j!==i))}>Remove</button>
   </div>)}
   <button className="btn g" onClick={()=>setD([...d,{s:"body",t:""}])}>Add text line</button>
   <button className="btn g" onClick={()=>setD([...d,{s:"space",t:""}])}>Add blank space</button>
  </details>
  <div className="template-actions">
   <button className="btn ok" onClick={save}>Save template</button>
   <button className="btn g" onClick={()=>setD(tpl)}>Discard changes</button>
  </div>
 </section><div className="template-preview"><h2>Live preview</h2><Preview tpl={d} data={{}}/></div></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
